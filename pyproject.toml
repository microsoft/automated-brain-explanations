[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro"
version = "0.1.0"
description = "Automated brain explanations using neuroscience data"
readme = "readme.md"
requires-python = ">=3.12"
authors = [
    {name = "Microsoft Research"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "azure-identity>=1.24.0",
    "datasets>=4.0.0",
    "dict-hash>=1.3.6",
    "imodels>=2.0.0",
    "langchain>=0.3.27",
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.2.0",
    "scipy>=1.15.3",
    "sentence-transformers>=5.1.0",
    "spacy>=3.8.7",
    "statsmodels>=0.14.5",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers[torch]>=4.23.1",
    "accelerate",
    "openai",
    "ridge-utils",
    "pycortex",
    "imodelsx",
    "amlt>=10.16.5",
    "cairosvg>=2.8.2",
    "sentencepiece>=0.2.1",
    "bert-score>=0.3.13",
    "pytest",
    "seaborn",
    "dvu",
    "jupyter",
    "ipython",
]

[tool.uv.sources]
amlt = { index = "msr" }

[[tool.uv.index]]
name = "msr"
url = "https://msrpypi.azurewebsites.net/stable/leloojoo"


[tool.setuptools.packages.find]
include = ["neuro*"]
exclude = ["tests*"]
